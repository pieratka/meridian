# Fly.io config for the consolidated Meridiano app (single machine: web + daily brief cron).
# `fly launch` may rename the app / pick a region; adjust as needed.
app = "meridiano-pierre"
primary_region = "cdg"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  # SQLite on the mounted volume (see [mounts]).
  DATABASE_URL = "sqlite:////data/meridian.db"
  FLASK_ENV = "production"
  # Gemini via liteLLM (GEMINI_API_KEY is a secret). Without these the app falls
  # back to meridiano's Deepseek/Together defaults.
  LLM_CHAT_MODEL = "gemini/gemini-2.5-flash-lite"
  SYNTHESIS_MODEL = "gemini/gemini-2.5-flash"
  EMBEDDING_MODEL = "gemini/gemini-embedding-001"
  # Cron runs in this timezone (so the daily brief stays at 09:30 Paris across DST).
  TZ = "Europe/Paris"

# Persistent volume holding the SQLite database. Create with:
#   fly volumes create data --size 1
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  # Must stay up: the cron runs in this machine and it owns the SQLite volume.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
