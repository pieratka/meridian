{% set profile_params = {'feed_profile': current_feed_profile} if current_feed_profile is defined and current_feed_profile else {} %}
<header class="main-header">
    <div class="header-content">
        <a href="{{ url_for('index', **profile_params) }}" class="logo">
            <img src="{{ url_for('static', filename='icons/icon.svg') }}" alt="Daily Presidential Brief Icon" style="height: 1.2em; vertical-align: middle; margin-right: 8px;">
            Daily Presidential Brief
        </a>
        <div class="header-actions">
            <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">
                <i id="theme-toggle-icon" class="fas fa-moon"></i>
            </button>
            <div class="lang-toggle" role="group" aria-label="Language">
                <a href="{{ url_for('set_lang', lang='en') }}" class="{{ 'active' if lang == 'en' else '' }}">EN</a>
                <a href="{{ url_for('set_lang', lang='fr') }}" class="{{ 'active' if lang == 'fr' else '' }}">FR</a>
            </div>
        </div>
    </div>
</header>
{% include '_flash_messages.html' %}
